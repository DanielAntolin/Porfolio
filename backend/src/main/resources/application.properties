spring.application.name=portfolio-backend
server.port=8080
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
contact.recipient-email=${CONTACT_RECIPIENT_EMAIL:}
contact.security-secret=${CONTACT_SECURITY_SECRET:change-this-before-production}
spring.datasource.url=jdbc:h2:file:${CONTACT_DATABASE_PATH:./data/contact-security};MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
